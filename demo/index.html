<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>THF 4x9 Gray</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <section class="toolbar" aria-label="Font controls">
        <label>
          <span>Text</span>
          <textarea id="text" rows="2">한글 Pixel Font 4x9
THF gray Aa!? ♥ ☺ 😀</textarea>
        </label>
        <label>
          <span>Scale</span>
          <input id="scale" type="range" min="4" max="18" value="10">
        </label>
      </section>
      <canvas id="preview" aria-label="3x8 grayscale Korean pixel font preview"></canvas>
    </main>
    <script type="module">
      import { renderText } from "../src/thf4x9.js";

      const font = await fetch("../font/thf-4x9-gray.json").then((response) => response.json());
      const canvas = document.querySelector("#preview");
      const textInput = document.querySelector("#text");
      const scaleInput = document.querySelector("#scale");

      function draw() {
        renderText(canvas, textInput.value, font, {
          scale: Number(scaleInput.value),
          background: "#eeeeee",
          padding: 2
        });
      }

      textInput.addEventListener("input", draw);
      scaleInput.addEventListener("input", draw);
      draw();
    </script>
  </body>
</html>
