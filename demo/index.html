<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>THF Original Gray</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <section class="toolbar" aria-label="Font controls">
        <label>
          <span>Text</span>
          <textarea id="text" rows="2">&#54620;&#44544; &#12593;&#12596;&#12599; &#12623;&#12625;&#12643;
THF gray Aa!? &#9829; &#9786; &#128512;</textarea>
        </label>
        <label>
          <span>Scale</span>
          <input id="scale" type="range" min="4" max="18" value="10">
        </label>
      </section>
      <canvas id="preview" aria-label="THF Original Gray preview"></canvas>
    </main>
    <script type="module">
      import { renderText } from "../src/thf-original.js";

      const font = await fetch("../font/thf-original-gray.json").then((response) => response.json());
      const canvas = document.querySelector("#preview");
      const textInput = document.querySelector("#text");
      const scaleInput = document.querySelector("#scale");

      function draw() {
        renderText(canvas, textInput.value, font, {
          scale: Number(scaleInput.value),
          background: "#050505",
          padding: 2
        });
      }

      textInput.addEventListener("input", draw);
      scaleInput.addEventListener("input", draw);
      draw();
    </script>
  </body>
</html>
